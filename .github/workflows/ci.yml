# Integración y despliegue continuos (ADR-0014).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      - name: Formato, lint y tipos
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Pruebas unitarias, de componentes, de integración y E2E
        run: npm run test:all
      - name: Cobertura del dominio (≥ 90 %)
        run: npx vitest run --project unit --project component --coverage
      - name: Matriz de trazabilidad
        run: npm run traceability
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.sha }}
          path: |
            reports/
            playwright-report/
            docs/06-pruebas/matriz-trazabilidad.md
          retention-days: 90

  deploy:
    name: Desplegar y probar en producción
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migraciones de base de datos
        run: npx wrangler d1 migrations apply amigo-invisible --remote
      - name: Compilar y desplegar
        run: npm run deploy
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Pruebas en producción
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: npm run test:prod
      - name: Guardar evidencias de producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-produccion-${{ github.sha }}
          path: |
            reports/playwright-prod.json
            playwright-report-prod/
          retention-days: 90
